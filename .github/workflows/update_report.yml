name: 定時更新 NVIDIA 台灣合作夥伴概念股報告

on:
  schedule:
    # 台灣時間週一至週五每天 15:30 (UTC 07:30) 觸發
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行報告生成與數據抓取
        run: |
          python generate_nvidia_report.py

      - name: Commit 並 Push 變更至儲存庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add stock_data.json nvidia_taiwan_partners_report.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 自動更新股市數據與 HTML 報告 [$(date +'%Y-%m-%d %H:%M')]" && git push)

      - name: 部署至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
